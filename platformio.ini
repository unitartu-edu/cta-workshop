[platformio]
default_envs = wro_car_ackermann

[env]
platform = atmelavr
; Use nanoatmega328 instead if upload fails with "not in sync" (old bootloader)
board = nanoatmega328new
framework = arduino
extra_scripts = pre:select_src.py

[env:wro_car_ackermann]
lib_deps = arduino-libraries/Servo

[env:wro_car_diff]
lib_deps = arduino-libraries/Servo

[env:huskylens]
custom_sketch = huskylens_arduino
lib_deps = https://github.com/HuskyLens/HUSKYLENSArduino.git
